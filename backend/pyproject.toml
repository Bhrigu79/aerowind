[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerowind-backend"
version = "0.1.0"
description = "AEROWIND — Autonomous AI Performance Engineer backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Validation / settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Cache / Queue
    "redis>=5.0.4",
    "celery>=5.4.0",

    # HTTP client (for provider adapters)
    "httpx>=0.27.0",

    # Observability / logging
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "scipy>=1.10.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "orjson>=3.10.3",
    "ulid-py>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Provider SDKs
    "nebius>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
